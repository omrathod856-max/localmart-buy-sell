name: LocalMart CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: ${{ secrets.MONGODB_URI_TEST || 'mongodb://localhost:27017/localmart-test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-for-ci-only-32-chars-long' }}
      CLIENT_URL: http://localhost:5173
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      PORT: 5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run backend tests
        working-directory: server
        run: npm run test:ci

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://localmart-backend.onrender.com/api' }}

      - name: Verify build output
        run: |
          if [ ! -f client/dist/index.html ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi
          echo "Build successful"

  lint:
    name: Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check backend package.json validity
        working-directory: server
        run: node -e "require('./package.json'); console.log('package.json valid')"

      - name: Validate server entry point
        working-directory: server
        run: node --check src/app.js && echo "Syntax check passed"
